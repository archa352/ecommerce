name: CI

on:
  push:
    branches: [main, zeen]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tws
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: tws_ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tws -d tws_ecommerce"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://tws:ci-only-password@localhost:5432/tws_ecommerce
      TEST_DATABASE_URL: postgresql+asyncpg://tws:ci-only-password@localhost:5432/tws_ecommerce_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-access-secret-not-used-anywhere-else
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-used-anywhere-else
      CORS_ORIGINS: http://localhost:3000
      STORAGE_LOCAL_PATH: /tmp/ci-uploads

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Dependency vulnerabilities
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -r requirements-dev.txt

      - name: Migrate an empty database from history
        run: alembic upgrade head

      - name: Migrations match the models
        run: alembic check

      - name: Tests
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tws
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: tws_ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tws -d tws_ecommerce"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://tws:ci-only-password@localhost:5432/tws_ecommerce
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-access-secret-not-used-anywhere-else
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-used-anywhere-else
      CORS_ORIGINS: http://localhost:3000
      STORAGE_LOCAL_PATH: /tmp/ci-uploads
      SEED_TENANT_DOMAIN: localhost
      SEED_ADMIN_PHONE: "+919000000000"
      SEED_ADMIN_EMAIL: ci-admin@example.com
      SEED_ADMIN_PASSWORD: ci-only-admin-password
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_CURRENCY: INR

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Start the API the build prerenders the catalogue from
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python -m app.commands.bootstrap
          nohup uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8000/health/ready > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/api.log
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (lockfile resolved with legacy peer handling)
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Production build
        working-directory: frontend
        run: npm run build
